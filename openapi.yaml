openapi: 3.0.0
info:
  contact: {}
  description: >-
    Premium y puntos con Mercado Pago, y boosts de servidor pagados con puntos.


    Las rutas `/v1/billing/**` requieren el access token de identify (`Authorization: Bearer <JWT>`, HS256): el servicio lo verifica aunque Kong también lo haga, porque mueve dinero. Los montos van en centavos de ARS.


    Todos los errores tienen la forma `{"error": {"code": "...", "message": "...", "details": {}}}`; `details` siempre viene y es un objeto, vacío cuando no hay nada que agregar; por ejemplo `INSUFFICIENT_POINTS` trae `balance`, `cost` y `missing`.


    Las rutas de simulación de desarrollo (`/dev/billing/simulate-*`) solo existen con `BILLING_DEV_TOOLS=true`, nunca en producción, y no forman parte de este contrato.
  title: Discordia - Billing
  version: 1.0.0
paths:
  /livez:
    get:
      description: Confirma que el proceso está vivo. No consulta ninguna dependencia.
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
      summary: Liveness check
      tags:
        - Health
  /readyz:
    get:
      description: "Confirma que el servicio puede operar: llega a la base de datos."
      responses:
        "200":
          description: Listo para recibir tráfico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      summary: Readiness check
      tags:
        - Health
  /v1/billing/boosts:
    get:
      description: Todos los estados, también los retirados (`removed`). Con
        `server_id`, solo los de ese servidor. `total` y `active` cuentan todos
        los boosts del filtro, no solo los de la página.
      parameters:
        - description: Solo los boosts de este servidor; vacío equivale a no enviarlo
          in: query
          name: server_id
          schema:
            type: string
            format: uuid
        - description: Tamaño de la página. Un valor mayor que 100 se trata como 100.
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 50
        - description: Cuántos boosts saltear
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Página de boosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostPage"
        "400":
          description: INVALID_QUERY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Mis boosts, del más nuevo al más viejo, por páginas
      tags:
        - Boosts
    post:
      description: "Reserva los puntos y le pregunta a servers si puede aplicar el
        boost, así que responde 202 con el boost en `pending`. Hay que consultar
        `GET /v1/billing/boosts/{id}` hasta que deje de estar `pending`:
        normalmente tarda segundos. Si servers lo rechaza (servidor inexistente
        o suspendido, quien boostea no es miembro, o el servidor ya tiene los 30
        boosts del último nivel) queda `failed` y los puntos vuelven. Si no
        responde en 24 horas, también vuelven. Con `Idempotency-Key`, un doble
        clic devuelve el mismo boost y cobra una sola vez."
      parameters:
        - description: Clave única por intento, por ejemplo un UUID generado al abrir la
            pantalla. Repetir el pedido con la misma clave devuelve el mismo
            boost en vez de crear otro; se recuerda durante 24 horas.
          in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 255
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoostRequest"
        description: Servidor a boostear
        required: true
      responses:
        "202":
          description: Boost en pending, con los puntos ya descontados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boost"
        "400":
          description: INVALID_BODY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: INSUFFICIENT_POINTS, con balance, cost y missing en details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: IDEMPOTENCY_KEY_REUSED, la Idempotency-Key ya se usó para otro
            servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Boostea un servidor con 100 puntos
      tags:
        - Boosts
  "/v1/billing/boosts/{id}":
    delete:
      description: Se puede retirar aunque ya no seas miembro del servidor.
      parameters:
        - description: ID del boost
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Boost en removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boost"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: BOOST_NOT_FOUND; también si el boost es de otro usuario o el id no
            es un UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: BOOST_NOT_ACTIVE, solo se puede retirar un boost activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Retira un boost activo propio, sin devolver los puntos
      tags:
        - Boosts
    get:
      parameters:
        - description: ID del boost
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: El boost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boost"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: BOOST_NOT_FOUND; también si el boost es de otro usuario o el id no
            es un UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Estado de un boost propio
      tags:
        - Boosts
  /v1/billing/boosts/servers:
    get:
      description: Un servidor por fila, el boosteado más recientemente primero, con
        cuántos de mis boosts hay ahí en cada estado. Entra si tengo algún
        boost, en cualquier estado.
      parameters:
        - description: Tamaño de la página. Un valor mayor que 100 se trata como 100.
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 50
        - description: Cuántos servidores saltear
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Página de servidores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostedServerPage"
        "400":
          description: INVALID_QUERY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Servidores que boosteé, por páginas
      tags:
        - Boosts
  /v1/billing/points:
    get:
      parameters:
        - description: Cuántos movimientos y cuántas compras devolver; aplica a las dos
            listas. Un valor mayor que 100 se trata como 100.
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Saldo y listas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Points"
        "400":
          description: INVALID_QUERY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Saldo, últimos movimientos y últimas compras
      tags:
        - Points
  /v1/billing/points/checkout:
    post:
      description: Al terminar, Mercado Pago vuelve a
        `<CHECKOUT_RETURN_URL>/billing/return?kind=points&purchase_id=…`. La
        acreditación la hace el webhook; la pantalla de retorno consulta `GET
        /v1/billing/purchases/{id}` hasta que la compra deje de estar `pending`.
      parameters:
        - description: Clave única por intento de compra, por ejemplo un UUID generado al
            abrir la pantalla. Repetir el pedido con la misma clave devuelve el
            mismo checkout en vez de crear otro; se recuerda durante 24 horas.
          in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 255
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointsCheckoutRequest"
        description: Paquete a comprar
        required: true
      responses:
        "201":
          description: Compra creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "400":
          description: INVALID_BODY, o UNKNOWN_PACKAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CHECKOUT_IN_PROGRESS, otro pedido con la misma Idempotency-Key
            sigue en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: IDEMPOTENCY_KEY_REUSED, la Idempotency-Key ya se usó para otro pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Crea una compra de puntos y devuelve la página de pago de Mercado Pago
      tags:
        - Points
  /v1/billing/points/packages:
    get:
      description: Los precios van en centavos de ARS.
      responses:
        "200":
          description: Paquetes disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageList"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Paquetes de puntos a la venta
      tags:
        - Points
  /v1/billing/premium:
    get:
      parameters:
        - description: Con `1` o `true`, consulta a Mercado Pago antes de responder (usar
            al volver del checkout); cualquier otro valor se ignora
          in: query
          name: refresh
          schema:
            type: string
      responses:
        "200":
          description: Estado de Premium
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Premium"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Estado de Premium del usuario
      tags:
        - Premium
  /v1/billing/premium/cancel:
    post:
      responses:
        "200":
          description: Premium sin renovación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Premium"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: NO_LIVE_SUBSCRIPTION, no hay una suscripción que cancelar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Cancela la renovación; Premium sigue hasta premium_until
      tags:
        - Premium
  /v1/billing/premium/checkout:
    post:
      description: Al terminar, Mercado Pago vuelve a
        `<CHECKOUT_RETURN_URL>/billing/return?kind=premium`. El cuerpo es
        opcional.
      parameters:
        - description: Clave única por intento de compra, por ejemplo un UUID generado al
            abrir la pantalla. Repetir el pedido con la misma clave devuelve el
            mismo checkout en vez de crear otro; se recuerda durante 24 horas.
          in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 255
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PremiumCheckoutRequest"
        description: Datos del pagador
      responses:
        "201":
          description: Suscripción creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumCheckout"
        "400":
          description: INVALID_BODY o PAYER_EMAIL_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_SUBSCRIBED, ya tiene una suscripción que Mercado Pago sigue
            cobrando; o CHECKOUT_IN_PROGRESS, otro pedido con la misma
            Idempotency-Key sigue en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: IDEMPOTENCY_KEY_REUSED, la Idempotency-Key ya se usó para otro pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Crea la suscripción y devuelve la página donde se carga la tarjeta
      tags:
        - Premium
  "/v1/billing/purchases/{id}":
    get:
      description: Lo consulta la pantalla de retorno del checkout hasta que la compra
        deja de estar `pending`.
      parameters:
        - description: ID de la compra
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: La compra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: PURCHASE_NOT_FOUND; también si la compra es de otro usuario o el id
            no es un UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Estado de una compra propia
      tags:
        - Points
  /webhooks/mercadopago:
    post:
      description: "Pública (sin JWT). Valida `x-signature` con `MP_WEBHOOK_SECRET` y
        una tolerancia de 5 minutos. Tópicos: `order`,
        `subscription_preapproval`, `subscription_authorized_payment`,
        `payment`, `topic_chargebacks_wh`. Cada aviso vuelve a consultar el
        recurso en Mercado Pago, así que repetirlo no cambia nada. Un aviso con
        firma inválida nunca recibe 2xx."
      parameters:
        - description: Tópico de la notificación
          in: query
          name: type
          schema:
            type: string
        - description: ID del recurso que cambió; la firma lo cubre
          in: query
          name: data.id
          schema:
            type: string
        - description: Firma de Mercado Pago (`ts=…,v1=…`)
          in: header
          name: x-signature
          required: true
          schema:
            type: string
        - description: ID del pedido, también cubierto por la firma
          in: header
          name: x-request-id
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookNotification"
        description: Cuerpo informativo de la notificación
      responses:
        "200":
          description: Procesado o ignorado (tópico desconocido, recurso ajeno o
            inconsistente)
        "401":
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: PAYLOAD_TOO_LARGE, el cuerpo supera los 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL_ERROR, falló el procesamiento; Mercado Pago reintenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Notificaciones de Mercado Pago
      tags:
        - Webhooks
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    BearerAuth:
      description: Escribir "Bearer " seguido del JWT.
      in: header
      name: Authorization
      type: apiKey
  schemas:
    ApiError:
      properties:
        code:
          example: INVALID_BODY
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          example: La solicitud no es válida
          type: string
      required:
        - code
        - details
        - message
      type: object
    Boost:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        points:
          example: 100
          type: integer
        server_id:
          format: uuid
          type: string
        status:
          description: failed gave the points back; removed did not.
          enum:
            - pending
            - active
            - failed
            - removed
          type: string
        status_detail:
          description: >-
            Why it failed or was removed: server_not_found, server_suspended,

            not_a_member, max_level_reached, cancelled, no_response or

            server_deleted. Empty if it doesn't apply, also when the owner removed it.
          type: string
        updated_at:
          description: When a boost was removed, when it was removed.
          format: date-time
          type: string
      required:
        - created_at
        - id
        - points
        - server_id
        - status
        - status_detail
        - updated_at
      type: object
    BoostPage:
      properties:
        active:
          description: Active boosts that match the filter, not only the ones in this page.
          example: 7
          type: integer
        boosts:
          items:
            $ref: "#/components/schemas/Boost"
          type: array
        limit:
          example: 10
          type: integer
        offset:
          example: 0
          type: integer
        total:
          description: Every boost that matches the filter, not only the ones in this page.
          example: 13
          type: integer
      required:
        - active
        - boosts
        - limit
        - offset
        - total
      type: object
    BoostRequest:
      properties:
        server_id:
          format: uuid
          type: string
      required:
        - server_id
      type: object
    BoostedServer:
      properties:
        active:
          example: 7
          type: integer
        failed:
          example: 1
          type: integer
        last_boost_at:
          format: date-time
          type: string
        pending:
          example: 0
          type: integer
        removed:
          example: 2
          type: integer
        server_id:
          format: uuid
          type: string
      required:
        - active
        - failed
        - last_boost_at
        - pending
        - removed
        - server_id
      type: object
    BoostedServerPage:
      properties:
        limit:
          example: 10
          type: integer
        offset:
          example: 0
          type: integer
        servers:
          items:
            $ref: "#/components/schemas/BoostedServer"
          type: array
        total:
          example: 14
          type: integer
      required:
        - limit
        - offset
        - servers
        - total
      type: object
    Checkout:
      properties:
        checkout_url:
          format: uri
          type: string
        purchase_id:
          format: uuid
          type: string
      required:
        - checkout_url
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
        - error
      type: object
    HealthStatus:
      properties:
        status:
          enum:
            - ready
            - unavailable
          type: string
      required:
        - status
      type: object
    LedgerEntry:
      properties:
        created_at:
          format: date-time
          type: string
        delta:
          description: Positive when points are credited, negative when they are taken
            back or spent.
          type: integer
        reason:
          enum:
            - purchase
            - refund
            - chargeback
            - boost
            - boost_refund
          type: string
        server_id:
          format: uuid
          type: string
      required:
        - created_at
        - delta
        - reason
      type: object
    Package:
      properties:
        id:
          example: points_550
          type: string
        points:
          example: 550
          type: integer
        price_cents:
          example: 500000
          type: integer
        title:
          example: 550 puntos
          type: string
      required:
        - id
        - points
        - price_cents
        - title
      type: object
    PackageList:
      properties:
        packages:
          items:
            $ref: "#/components/schemas/Package"
          type: array
      required:
        - packages
      type: object
    Points:
      properties:
        balance:
          type: integer
        ledger:
          items:
            $ref: "#/components/schemas/LedgerEntry"
          type: array
        purchases:
          items:
            $ref: "#/components/schemas/Purchase"
          type: array
      required:
        - balance
        - ledger
        - purchases
      type: object
    PointsCheckoutRequest:
      properties:
        package_id:
          example: points_550
          type: string
        payer_email:
          description: "optional: preloads the email in Mercado Pago"
          format: email
          type: string
        return_to:
          default: web
          description: With "app", Mercado Pago returns to
            <CHECKOUT_RETURN_URL>/app-link/billing/return, which opens the
            mobile app.
          enum:
            - web
            - app
          type: string
      required:
        - package_id
      type: object
    Premium:
      properties:
        active:
          type: boolean
        mp_status:
          description: Status of the latest subscription in Mercado Pago; empty if there
            is none.
          type: string
        premium_until:
          description: Null if the user never paid.
          format: date-time
          type: string
          nullable: true
        renews:
          type: boolean
        state:
          allOf:
            - $ref: "#/components/schemas/service.PremiumState"
          enum:
            - none
            - processing_first_payment
            - active
            - active_canceled
            - expired
      required:
        - active
        - mp_status
        - premium_until
        - renews
        - state
      type: object
    PremiumCheckout:
      properties:
        checkout_url:
          format: uri
          type: string
      required:
        - checkout_url
      type: object
    PremiumCheckoutRequest:
      properties:
        payer_email:
          description: Required in production; in sandbox the test buyer's email replaces
            it.
          format: email
          type: string
        return_to:
          default: web
          description: With "app", Mercado Pago returns to
            <CHECKOUT_RETURN_URL>/app-link/billing/return, which opens the
            mobile app.
          enum:
            - web
            - app
          type: string
      type: object
    Purchase:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        package_id:
          example: points_550
          type: string
        points:
          example: 550
          type: integer
        points_unrecovered:
          description: Points already spent that couldn't be taken back on a refund or
            chargeback.
          type: integer
        price_cents:
          example: 500000
          type: integer
        status:
          enum:
            - pending
            - paid
            - failed
            - expired
            - refunded
            - charged_back
          type: string
        status_detail:
          description: Why the purchase ended as it did; empty if it doesn't apply.
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - created_at
        - id
        - package_id
        - points
        - points_unrecovered
        - price_cents
        - status
        - status_detail
        - updated_at
      type: object
    WebhookNotification:
      properties:
        action:
          type: string
        data:
          properties:
            id:
              type: string
          required:
            - id
          type: object
        type:
          type: string
      required:
        - action
        - data
        - type
      type: object
    service.PremiumState:
      enum:
        - none
        - processing_first_payment
        - active
        - active_canceled
        - expired
      type: string
      x-enum-varnames:
        - PremiumStateNone
        - PremiumStateProcessingFirstPayment
        - PremiumStateActive
        - PremiumStateActiveCanceled
        - PremiumStateExpired
